<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MBE Practice · Natalie's Bar Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe6;
    --paper-2: #ebe4d6;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --rule: #d4cab3;
    --burgundy: #6b1f24;
    --burgundy-dark: #4a1418;
    --forest: #2d4a3a;
    --gold: #a98748;
    --correct: #2d4a3a;
    --incorrect: #8b2a1f;
    --correct-bg: #e3ead8;
    --incorrect-bg: #f0d8d3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    padding: 32px 20px 60px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(169, 135, 72, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(107, 31, 36, 0.04) 0%, transparent 50%);
  }
  .container { max-width: 720px; margin: 0 auto; }

  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fbf7ee;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 10px 18px;
    margin-bottom: 28px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--burgundy);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 44px;
  }
  .home-btn:hover {
    background: var(--burgundy);
    color: var(--paper);
    border-color: var(--burgundy);
  }
  .home-icon {
    font-size: 18px;
    line-height: 1;
    font-weight: 400;
  }

  header { text-align: center; margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--burgundy); margin-bottom: 14px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500; font-size: 44px;
    letter-spacing: -0.01em; line-height: 1.05;
    color: var(--ink); margin-bottom: 8px;
  }
  h1 em { font-style: italic; color: var(--burgundy); font-weight: 600; }
  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 13px; color: var(--ink-soft); letter-spacing: 0.04em;
  }

  /* ===== START SCREEN ===== */
  .start-screen { display: block; }
  .start-screen.hidden { display: none; }
  .start-card {
    background: #fbf7ee;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 36px 32px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 8px 24px -12px rgba(74, 20, 24, 0.15);
    margin-bottom: 24px;
  }
  .section-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .subject-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .subject-option {
    display: flex; align-items: center; gap: 14px;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 3px; padding: 16px 18px;
    cursor: pointer; transition: all 0.15s ease;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; color: var(--ink);
  }
  .subject-option:hover { border-color: var(--burgundy); background: #fff; }
  .subject-option.selected { border-color: var(--burgundy); background: var(--paper-2); }
  .subject-checkbox {
    width: 22px; height: 22px; border: 2px solid var(--rule);
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; background: #fff; transition: all 0.15s ease;
  }
  .subject-option.selected .subject-checkbox {
    background: var(--burgundy); border-color: var(--burgundy);
  }
  .subject-option.selected .subject-checkbox::after {
    content: '✓'; color: #fff; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600;
  }
  .subject-name { flex: 1; }
  .subject-count {
    font-family: 'Inter', sans-serif; font-size: 12px;
    color: var(--ink-soft); letter-spacing: 0.05em;
  }
  .count-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .count-option {
    flex: 1; min-width: 80px;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 3px; padding: 12px 14px;
    cursor: pointer; transition: all 0.15s ease;
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    text-align: center; color: var(--ink);
  }
  .count-option:hover { border-color: var(--burgundy); }
  .count-option.selected {
    background: var(--burgundy); color: var(--paper);
    border-color: var(--burgundy);
  }
  .start-btn {
    width: 100%; background: var(--burgundy); color: var(--paper);
    border: none; padding: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
    transition: background 0.2s ease; min-height: 56px;
  }
  .start-btn:hover { background: var(--burgundy-dark); }
  .start-btn:disabled { background: var(--rule); cursor: not-allowed; }

  /* ===== PROGRESS ===== */
  .progress-wrap {
    margin-bottom: 28px; display: flex; align-items: center; gap: 14px;
  }
  .progress-label {
    font-family: 'Inter', sans-serif; font-size: 12px;
    color: var(--ink-soft); letter-spacing: 0.05em; white-space: nowrap;
  }
  .progress-bar {
    flex: 1; height: 3px; background: var(--paper-2);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--burgundy); width: 0%;
    transition: width 0.4s ease;
  }

  /* ===== QUESTION CARD ===== */
  .card {
    background: #fbf7ee; border: 1px solid var(--rule);
    border-radius: 4px; padding: 36px 32px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 8px 24px -12px rgba(74, 20, 24, 0.15);
  }
  .question-num {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    color: var(--gold); letter-spacing: 0.18em;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .question-topic {
    display: inline-block;
    font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
    color: var(--ink-soft); background: var(--paper-2);
    padding: 4px 10px; border-radius: 2px;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 20px;
  }
  .fact-pattern {
    font-size: 19px; line-height: 1.55; color: var(--ink); margin-bottom: 24px;
  }
  .call {
    font-style: italic; font-size: 18px;
    color: var(--ink-soft); margin-bottom: 28px;
    padding-left: 16px; border-left: 2px solid var(--gold);
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%; text-align: left;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 3px; padding: 16px 18px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; line-height: 1.45; color: var(--ink);
    cursor: pointer; transition: all 0.15s ease; min-height: 60px;
  }
  .choice:hover:not(.locked) { border-color: var(--burgundy); background: #fff; }
  .choice:active:not(.locked) { transform: scale(0.995); }
  .choice-letter {
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--burgundy); background: var(--paper-2);
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .choice-text { flex: 1; }
  .choice.correct { border-color: var(--correct); background: var(--correct-bg); }
  .choice.correct .choice-letter { background: var(--correct); color: #fff; }
  .choice.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .choice.incorrect .choice-letter { background: var(--incorrect); color: #fff; }
  .choice.locked { cursor: default; }
  .choice.locked:not(.correct):not(.incorrect) { opacity: 0.5; }

  /* ===== EXPLANATION ===== */
  .explanation {
    margin-top: 24px; padding: 22px 24px;
    background: var(--paper-2);
    border-left: 3px solid var(--gold);
    border-radius: 2px; display: none;
  }
  .explanation.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .explanation-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 600; color: var(--burgundy);
    letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;
  }
  .explanation-text { font-size: 17px; line-height: 1.55; color: var(--ink); }
  .explanation-text strong { font-weight: 600; color: var(--burgundy-dark); }
  .explanation-text em { font-style: italic; }

  .btn-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 24px; gap: 12px; flex-wrap: wrap;
  }
  .next-btn {
    display: none;
    background: var(--burgundy); color: var(--paper); border: none;
    padding: 14px 28px;
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
    transition: background 0.2s ease; min-height: 48px; margin-left: auto;
  }
  .next-btn.show { display: block; animation: fadeIn 0.3s ease; }
  .next-btn:hover { background: var(--burgundy-dark); }
  .quit-btn {
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--rule);
    padding: 12px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; border-radius: 3px; min-height: 48px;
  }
  .quit-btn:hover { color: var(--burgundy); border-color: var(--burgundy); }

  /* ===== RESULTS ===== */
  .results { display: none; text-align: center; padding: 50px 20px 20px; }
  .results.show { display: block; animation: fadeIn 0.4s ease; }
  .results-eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--burgundy); margin-bottom: 18px;
  }
  .results-score {
    font-family: 'Cormorant Garamond', serif;
    font-size: 96px; line-height: 1; font-weight: 500;
    color: var(--ink); margin-bottom: 8px;
  }
  .results-score em { font-style: italic; color: var(--burgundy); }
  .results-total {
    font-family: 'Inter', sans-serif; font-size: 14px;
    color: var(--ink-soft); letter-spacing: 0.08em; margin-bottom: 32px;
  }
  .results-message {
    font-size: 22px; font-style: italic; color: var(--ink-soft);
    margin-bottom: 36px; max-width: 480px;
    margin-left: auto; margin-right: auto; line-height: 1.4;
  }
  .subject-breakdown {
    max-width: 480px; margin: 0 auto 36px;
    text-align: left;
    background: #fbf7ee;
    border: 1px solid var(--rule);
    border-radius: 4px; padding: 24px 28px;
  }
  .breakdown-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--rule);
    font-family: 'Inter', sans-serif; font-size: 14px;
  }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-subject { color: var(--ink); font-weight: 500; }
  .breakdown-score { color: var(--burgundy); font-weight: 600; }
  .restart-btn {
    background: var(--burgundy); color: var(--paper);
    border: none; padding: 16px 36px;
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
    transition: background 0.2s ease; min-height: 52px;
  }
  .restart-btn:hover { background: var(--burgundy-dark); }

  @media (min-width: 768px) {
    body { padding: 60px 40px; }
    h1 { font-size: 56px; }
    .card, .start-card { padding: 48px 44px; }
    .fact-pattern { font-size: 20px; }
    .choice { font-size: 18px; padding: 18px 22px; }
  }
  @media (max-width: 480px) {
    body { padding: 24px 14px 40px; }
    h1 { font-size: 34px; }
    .card, .start-card { padding: 26px 22px; }
    .fact-pattern { font-size: 17px; }
    .choice { font-size: 16px; padding: 14px 14px; }
    .results-score { font-size: 76px; }
  }
</style>
</head>
<body>
<div class="container">

  <a href="index.html" class="home-btn" aria-label="Return to home">
    <span class="home-icon" aria-hidden="true">⌂</span>
    <span>Home</span>
  </a>

  <header>
    <div class="eyebrow">Bar Prep Practice — MBE</div>
    <h1>Multistate <em>Bar Exam</em></h1>
    <div class="subtitle">Four subjects · 204 questions · Tap to select your set</div>
  </header>

  <!-- START SCREEN -->
  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <div class="section-label">Choose Subject(s)</div>
      <div class="subject-grid" id="subjectGrid"></div>

      <div class="section-label">Number of Questions</div>
      <div class="count-options" id="countOptions">
        <div class="count-option" data-count="10">10</div>
        <div class="count-option selected" data-count="25">25</div>
        <div class="count-option" data-count="50">50</div>
        <div class="count-option" data-count="all">All</div>
      </div>

      <button class="start-btn" id="startBtn" onclick="startQuiz()">Begin Quiz</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="progress-wrap" id="progressWrap" style="display:none;">
    <div class="progress-label" id="progressLabel">Question 1 of 25</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="quizArea"></div>

  <!-- RESULTS SCREEN -->
  <div class="results" id="resultsArea">
    <div class="results-eyebrow">Session Complete</div>
    <div class="results-score"><span id="finalScore">0</span><em>/<span id="finalTotal">0</span></em></div>
    <div class="results-total" id="finalPercent">0%</div>
    <div class="results-message" id="finalMessage"></div>
    <div class="subject-breakdown" id="subjectBreakdown"></div>
    <button class="restart-btn" onclick="restart()">New Quiz</button>
  </div>

</div>

<script>
const SUBJECTS = {
  torts: { name: "Torts", color: "burgundy" },
  civpro: { name: "Civil Procedure", color: "forest" },
  contracts: { name: "Contracts", color: "gold" },
  property: { name: "Real Property", color: "burgundy" }
};

const questions = [
  {
    subject: "torts",
    topic: "Negligence · Duty to Rescue",
    fact: "A pedestrian sees a small child drowning in a shallow public fountain. The pedestrian is a strong swimmer and could easily save the child without any risk to himself. He is a stranger to the child and did nothing to cause the child to fall in. The pedestrian chooses to do nothing, and the child drowns. The child's parents bring a wrongful death action against the pedestrian.",
    call: "Will the parents prevail?",
    choices: [
      "Yes, because a reasonable person would have intervened.",
      "No, because the pedestrian owed no duty to rescue the child.",
      "No, because the pedestrian's failure to act was not the cause of the drowning.",
      "Yes, because the pedestrian could have rescued the child safely."
    ],
    correct: 1,
    explanation: "The case turns on <strong>duty</strong>. At common law, there is no general duty to rescue a stranger, even when rescue could be performed safely. A duty arises only in narrow circumstances: a special relationship, a statutory duty, when the defendant created the peril, or when he voluntarily began a rescue. None applies here. (D) and (A) are wrong because ease and reasonableness are irrelevant without a duty. (C) is wrong because the failure to act was a but-for cause of the drowning; the case fails on duty, not causation."
  },
  {
    subject: "torts",
    topic: "Negligence · Causation",
    fact: "Two separate forest fires, each negligently started by a different defendant, merge and burn down the plaintiff's house. Either fire alone would have been sufficient to destroy the house. The plaintiff sues both defendants for negligence.",
    call: "Will the plaintiff recover from both defendants?",
    choices: [
      "No, because the plaintiff cannot prove but-for causation against either defendant.",
      "Yes, because each defendant's conduct was a substantial factor in causing the harm.",
      "No, because the house would have burned regardless of either defendant's conduct.",
      "Yes, because the defendants were acting in concert."
    ],
    correct: 1,
    explanation: "When two independent forces, either of which alone would have caused the harm, combine to produce it, courts apply the <strong>substantial factor test</strong> in place of but-for causation. Each defendant whose conduct was a substantial factor is a cause-in-fact. (A) correctly identifies the but-for problem but ignores the substantial factor exception. (D) is wrong because the defendants acted independently, not in concert. (C) reaches the wrong conclusion from the but-for problem."
  },
  {
    subject: "torts",
    topic: "Intentional Torts · Transferred Intent",
    fact: "Daniel throws a rock at Adam, intending to strike Adam in the head. The rock misses Adam and instead strikes Brett, who was standing behind a tree and whom Daniel did not see and did not know was there. Brett suffers a serious head injury and sues Daniel for battery.",
    call: "Will Brett prevail?",
    choices: [
      "No, because Daniel did not know Brett was there.",
      "Yes, because Daniel's intent to commit battery against Adam transfers to Brett.",
      "No, because Daniel did not intend to strike Brett.",
      "Yes, because throwing rocks is an abnormally dangerous activity."
    ],
    correct: 1,
    explanation: "Under <strong>transferred intent</strong>, when a defendant intends to commit one of the five trespassory torts (battery, assault, false imprisonment, trespass to land, trespass to chattels) against one person but instead commits the tort against another, the intent transfers to the actual victim. (C) and (A) sound right but ignore transferred intent. (D) is wrong because throwing rocks is not an abnormally dangerous activity in the strict liability sense."
  },
  {
    subject: "torts",
    topic: "Intentional Torts · Assault",
    fact: "Standing fifty feet from Paula in an open park, Dale shakes his fist and shouts, \"I'm going to break your nose tomorrow!\" Paula has no reason to doubt that Dale means what he says, and she is genuinely frightened. Dale makes no move toward her.",
    call: "Has Dale committed assault against Paula?",
    choices: [
      "Yes, because Dale's threat coupled with his gesture created apprehension of contact.",
      "No, because Dale was too far from Paula to reach her with his fist.",
      "Yes, because Paula reasonably feared that Dale would harm her.",
      "No, because the threatened harm was not imminent."
    ],
    correct: 3,
    explanation: "Assault requires reasonable apprehension of <strong>imminent</strong> harmful or offensive contact. A threat of future harm (\"tomorrow\") is not imminent. (C) captures Paula's fear but ignores imminence. (A) is wrong because a future-tense threat does not create apprehension of immediate contact. (B) reaches the right outcome for the wrong reason: distance alone is not dispositive — a person 50 feet away with a gun can commit assault. The defect is imminence in time."
  },
  {
    subject: "torts",
    topic: "Strict Liability · Products",
    fact: "A manufacturer designs and sells power saws to the general public. A latent design defect causes the blade guard to retract unexpectedly during normal use. A consumer, using the saw as intended and following the manual, suffers a severed hand when the guard retracts. The consumer sues the manufacturer in strict products liability.",
    call: "Will the consumer prevail?",
    choices: [
      "No, because the consumer assumed the risk of using a power saw.",
      "Yes, because the product was defective and unreasonably dangerous when sold.",
      "Yes, but only if the consumer proves the manufacturer was negligent.",
      "No, unless the consumer proves the manufacturer knew of the defect."
    ],
    correct: 1,
    explanation: "In <strong>strict products liability</strong>, the plaintiff must show (1) the product was defective when it left the defendant's control, (2) the defect made it unreasonably dangerous, (3) the product reached the user without substantial change, and (4) the defect caused the injury. Fault is not required. (C) and (D) wrongly import a fault element. (A) misapplies assumption of the risk, which requires knowledge of the <em>specific</em> defect."
  },
  {
    subject: "torts",
    topic: "Negligence · Res Ipsa Loquitur",
    fact: "A pedestrian walks past a flour warehouse owned and operated by the defendant when a barrel of flour falls from a third-story window and injures her. No one witnessed how the barrel came to fall. The pedestrian sues for negligence but cannot identify any specific negligent act by the defendant or its employees.",
    call: "Can the pedestrian survive a motion for directed verdict?",
    choices: [
      "No, because res ipsa loquitur requires the plaintiff to eliminate all other possible causes.",
      "Yes, because the doctrine of res ipsa loquitur permits an inference of negligence.",
      "No, because the pedestrian cannot identify a specific negligent act.",
      "Yes, because property owners are strictly liable for objects falling from their premises."
    ],
    correct: 1,
    explanation: "<strong>Res ipsa loquitur</strong> allows the jury to infer negligence when (1) the harm ordinarily does not occur without negligence, (2) the instrumentality was under the defendant's exclusive control, and (3) the plaintiff did not contribute. This is the classic <em>Byrne v. Boadle</em> pattern. (D) is wrong because there is no strict liability for falling objects. (C) misses res ipsa. (A) overstates the doctrine."
  },
  {
    subject: "torts",
    topic: "Defamation · Public Figure",
    fact: "A national magazine publishes an article falsely claiming that a U.S. Senator embezzled campaign funds. The reporter relied on a single anonymous source and made no effort to verify the claim. The Senator sues the magazine for defamation and proves the statement was false and damaged his reputation.",
    call: "Will the Senator prevail?",
    choices: [
      "Yes, because the statement was false and damaging.",
      "No, because public officials cannot recover for statements about their official conduct.",
      "No, unless the Senator proves the reporter acted with knowledge of falsity or reckless disregard for the truth.",
      "Yes, because the reporter was negligent in failing to verify."
    ],
    correct: 2,
    explanation: "Under <em>New York Times v. Sullivan</em>, a public official suing for defamation must prove <strong>actual malice</strong>: knowledge of falsity or reckless disregard for the truth. Negligence is not enough. (A) states the common-law elements but misses the constitutional overlay. (D) applies the wrong standard. (B) overstates the rule: public officials can recover, they just face a higher burden."
  },
  {
    subject: "torts",
    topic: "Vicarious Liability · Respondeat Superior",
    fact: "A pizza delivery driver, while driving his employer's vehicle to deliver a pizza, runs a red light and strikes a pedestrian. The driver was speeding because the delivery was running late. The pedestrian sues the pizza company. There is no evidence the company was negligent in hiring or supervising the driver.",
    call: "Is the pizza company liable?",
    choices: [
      "No, because the company itself was not negligent.",
      "Yes, because the driver was acting within the scope of employment.",
      "Yes, because the company is strictly liable for harm caused by its delivery operations.",

// ============ APP LOGIC ============

let selectedSubjects = new Set(["torts", "civpro", "contracts", "property"]);
let selectedCount = 25;
let currentQuestions = [];
let currentQ = 0;
let score = 0;
let answered = false;
let subjectScores = {};

function renderSubjectGrid() {
  const grid = document.getElementById('subjectGrid');
  grid.innerHTML = '';
  Object.entries(SUBJECTS).forEach(([key, info]) => {
    const count = questions.filter(q => q.subject === key).length;
    const div = document.createElement('div');
    div.className = 'subject-option' + (selectedSubjects.has(key) ? ' selected' : '');
    div.innerHTML = `
      <div class="subject-checkbox"></div>
      <div class="subject-name">${info.name}</div>
      <div class="subject-count">${count} questions</div>
    `;
    div.onclick = () => toggleSubject(key, div);
    grid.appendChild(div);
  });
}

function toggleSubject(key, el) {
  if (selectedSubjects.has(key)) {
    if (selectedSubjects.size > 1) {
      selectedSubjects.delete(key);
      el.classList.remove('selected');
    }
  } else {
    selectedSubjects.add(key);
    el.classList.add('selected');
  }
}

document.querySelectorAll('.count-option').forEach(opt => {
  opt.onclick = () => {
    document.querySelectorAll('.count-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    selectedCount = opt.dataset.count === 'all' ? 'all' : parseInt(opt.dataset.count);
  };
});

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = questions.filter(q => selectedSubjects.has(q.subject));
  const shuffled = shuffle(pool);
  const limit = selectedCount === 'all' ? shuffled.length : Math.min(selectedCount, shuffled.length);
  currentQuestions = shuffled.slice(0, limit);
  currentQ = 0;
  score = 0;
  subjectScores = {};
  Object.keys(SUBJECTS).forEach(k => { subjectScores[k] = { correct: 0, total: 0 }; });

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('progressWrap').style.display = 'flex';
  document.getElementById('resultsArea').classList.remove('show');
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuestions[currentQ];
  answered = false;

  document.getElementById('progressLabel').textContent = `Question ${currentQ + 1} of ${currentQuestions.length}`;
  document.getElementById('progressFill').style.width = `${(currentQ / currentQuestions.length) * 100}%`;

  const letters = ['A', 'B', 'C', 'D'];
  const choicesHTML = q.choices.map((choice, i) => `
    <button class="choice" data-index="${i}" onclick="selectAnswer(${i})">
      <span class="choice-letter">${letters[i]}</span>
      <span class="choice-text">${choice}</span>
    </button>
  `).join('');

  document.getElementById('quizArea').innerHTML = `
    <div class="card">
      <div class="question-num">Question ${currentQ + 1}</div>
      <div class="question-topic">${q.topic}</div>
      <div class="fact-pattern">${q.fact}</div>
      <div class="call">${q.call}</div>
      <div class="choices">${choicesHTML}</div>
      <div class="explanation" id="explanation">
        <div class="explanation-label">Explanation</div>
        <div class="explanation-text">${q.explanation}</div>
      </div>
      <div class="btn-row">
        <button class="quit-btn" onclick="quitToStart()">End Quiz</button>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">${currentQ === currentQuestions.length - 1 ? 'See Results' : 'Next Question'}</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentQ];
  const buttons = document.querySelectorAll('.choice');

  buttons.forEach((btn, i) => {
    btn.classList.add('locked');
    if (i === q.correct) btn.classList.add('correct');
    else if (i === index) btn.classList.add('incorrect');
  });

  subjectScores[q.subject].total++;
  if (index === q.correct) {
    score++;
    subjectScores[q.subject].correct++;
  }
  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= currentQuestions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('progressWrap').style.display = 'none';
  const pct = Math.round((score / currentQuestions.length) * 100);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalTotal').textContent = currentQuestions.length;
  document.getElementById('finalPercent').textContent = `${pct}%`;

  let msg = '';
  if (pct === 100) msg = 'Flawless. Onto the next subject.';
  else if (pct >= 80) msg = 'Strong session. Review the missed rules and move on.';
  else if (pct >= 60) msg = 'Solid foundation. Worth a second pass through the explanations.';
  else if (pct >= 40) msg = 'A few rules to revisit. The explanations cover what you need.';
  else msg = 'This is what practice is for. Read the explanations carefully and try again.';
  document.getElementById('finalMessage').textContent = msg;

  // Subject breakdown
  const breakdown = document.getElementById('subjectBreakdown');
  breakdown.innerHTML = '';
  Object.entries(SUBJECTS).forEach(([key, info]) => {
    const s = subjectScores[key];
    if (s.total === 0) return;
    const row = document.createElement('div');
    row.className = 'breakdown-row';
    const subjPct = Math.round((s.correct / s.total) * 100);
    row.innerHTML = `
      <div class="breakdown-subject">${info.name}</div>
      <div class="breakdown-score">${s.correct}/${s.total} · ${subjPct}%</div>
    `;
    breakdown.appendChild(row);
  });

  document.getElementById('resultsArea').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function quitToStart() {
  if (confirm('End the quiz and return to the start screen?')) {
    restart();
  }
}

function restart() {
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('resultsArea').classList.remove('show');
  document.getElementById('startScreen').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderSubjectGrid();
</script>
</body>
</html>
